<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Factory Helper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-screen">
        <h1 class="logo" style="margin-bottom: 24px;">Factory Helper</h1>
        <form class="card auth-form" method="post">
            <h2 class="subview-title" style="margin-bottom: 4px;">Вход</h2>
            {% if error %}<p class="field-error" style="display:block;">{{ error }}</p>{% endif %}
            <div class="field">
                <label class="field-label" for="username">Логин</label>
                <input class="field-input" type="text" id="username" name="username" required autofocus>
            </div>
            <div class="field" style="margin-top: 10px;">
                <label class="field-label" for="password">Пароль</label>
                <input class="field-input" type="password" id="password" name="password" required>
            </div>
            <button class="btn-primary" type="submit" style="margin-top: 16px;">Войти</button>
        </form>
        <p class="auth-switch">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
    </div>
</body>
</html>
