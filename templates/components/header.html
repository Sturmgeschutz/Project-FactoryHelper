<header class="header">
    <div class="header-top">
        <h1 class="logo">Factory Helper</h1>
        <div class="profile-menu-wrap">
            <button class="profile-btn" id="profileBtn" aria-label="Профиль">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/>
                </svg>
            </button>
            <div class="profile-dropdown" id="profileDropdown" hidden>
                <p class="profile-dropdown-name">{{ username }}</p>
                <form method="post" action="{{ url_for('logout') }}">
                    <button class="profile-dropdown-logout" type="submit">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</header>
