<section data-page="dashboard">
    <h2 class="page-title">Главная</h2>

    <div class="card hero-card">
        <div class="hero-top">
            <div>
                <p class="card-label">Следующая смена</p>
                <p class="card-title" id="heroTitle"></p>
            </div>
            <div class="ring">
                <div class="ring-inner">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
                    </svg>
                </div>
            </div>
        </div>
        <span class="chip chip-accent" id="heroChip"></span>
    </div>

    <div class="row-2">
        <div class="card">
            <p class="card-label" id="hoursLabel">Часы за месяц</p>
            <p class="metric-value" id="hoursValue"></p>
            <p class="card-sub">план ~168 ч</p>
        </div>
        <div class="card">
            <p class="card-label">Прогноз зарплаты</p>
            <p class="metric-value" id="salaryValue"></p>
            <p class="card-sub" id="salarySub"></p>
        </div>
    </div>

    <div class="card">
        <p class="card-label" id="progressLabel">Прогресс месяца</p>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="card-sub" id="progressSub">—</p>
    </div>

    <div class="card">
        <p class="card-label">Последняя заметка</p>
        <p class="note-text" id="lastNoteText">Заметок пока нет</p>
        <p class="card-sub" id="lastNoteTime"></p>
    </div>

    <div class="quick-actions">
        <button class="qbtn" id="quickShiftBtn">
            <span class="qicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
            <span class="qlabel">Смена</span>
        </button>
        <button class="qbtn" id="quickNoteBtn">
            <span class="qicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5V20h3.5L18.5 9 15 5.5 4 16.5z"/></svg></span>
            <span class="qlabel">Заметка</span>
        </button>
        <button class="qbtn" id="quickReminderBtn">
            <span class="qicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1112 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9z"/><path d="M10 19a2 2 0 004 0"/></svg></span>
            <span class="qlabel">Напоминание</span>
        </button>
        <button class="qbtn" id="quickCalcBtn">
            <span class="qicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01"/></svg></span>
            <span class="qlabel">Калькулятор</span>
        </button>
    </div>
</section>
